name: 💡 Feature request
description: Suggest an idea or improvement / Sugira uma ideia ou melhoria
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! English or Portuguese are both fine.
        Obrigado pela sugestão! Pode escrever em português.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your project where xLogger falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? A code snippet of the API you imagine helps a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other libraries that do this.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself and open a pull request.
