name: 🐛 Bug report
description: Something does not work as documented / Algo não funciona como documentado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! English or Portuguese are both fine.
        Obrigado por relatar! Pode escrever em português.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/YuriCirino/xlogger/issues) and this was not reported yet.
          required: true
        - label: I am using the latest xLogger release.
          required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      description: The smallest sketch that shows the problem. It will be formatted as C++.
      render: cpp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output / compiler error
      description: Serial Monitor output or the full compiler error.
      render: text
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board
      placeholder: e.g. Arduino Uno, ESP32 DevKit, Raspberry Pi Pico
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: xLogger version
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Build environment
      options:
        - PlatformIO
        - Arduino IDE 2.x
        - Arduino IDE 1.8.x
        - arduino-cli
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: platformio.ini, build flags (e.g. XLOGGER_MAX_LEVEL), core/platform version, anything else.
