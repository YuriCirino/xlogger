name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version matches in every file
        run: python3 extras/tools/check_version.py
      - name: Build and run
        run: sh extras/test/run.sh

  firmware-strip:
    name: Disabled levels removed from firmware (${{ matrix.board }} ${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: uno,      extra: "",    expect: all }
          - { board: esp32dev, extra: "",    expect: macros }
          - { board: esp32dev, extra: "-Os", expect: all }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-strip-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ matrix.extra }}
          restore-keys: |
            pio-strip-${{ runner.os }}-${{ matrix.board }}-
            pio-${{ runner.os }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio pyelftools
      - name: Build at levels 4 and 2 and inspect the ELF
        run: bash extras/tools/annotate_on_fail.sh bash extras/test/strip/check_strip.sh ${{ matrix.board }} "${{ matrix.extra }}" ${{ matrix.expect }}

  arduino-lint:
    name: Arduino Library Manager rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: specification

  ai-docs:
    name: AI reference (snippets compile, llms-full.txt in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check AI docs
        run: python3 extras/tools/ai_docs.py check
      - name: Validate Agent Skill
        run: |
          pip install skills-ref
          python3 -c "import pathlib, sys, skills_ref; e = skills_ref.validate(pathlib.Path('ai/skills/xlogger')); print(e or 'skill ok'); sys.exit(1 if e else 0)"

  build-examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/Basic/Basic.ino
          - examples/LevelsAndTags/LevelsAndTags.ino
          - examples/CompileTimeStrip/CompileTimeStrip.ino
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build on AVR, USB-native AVR, ESP32 and ESP8266
        run: >
          bash extras/tools/annotate_on_fail.sh
          pio ci --lib="."
          --board=uno
          --board=leonardo
          --board=esp32dev
          --board=nodemcuv2
          ${{ matrix.example }}
