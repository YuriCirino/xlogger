name: Publish to PlatformIO Registry

# Runs when a GitHub Release is published (e.g. tag v1.2.0).
# Requires the repository secret PLATFORMIO_AUTH_TOKEN (see docs/GUIA-pt-BR.md, section 13).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches library version
        if: github.event_name == 'release'
        run: python3 extras/tools/check_version.py "${{ github.event.release.tag_name }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Publish
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          if [ -z "$PLATFORMIO_AUTH_TOKEN" ]; then
            echo "::warning::PLATFORMIO_AUTH_TOKEN secret is not set; skipping publish."
            exit 0
          fi
          pio pkg publish --no-interactive
