; Example PlatformIO project using xLogger.
; Copy this folder anywhere, open it in VS Code + PlatformIO and build.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/YuriCirino/xlogger.git#v1.2.0

; Development: every log level compiled in.
[env:uno_debug]
platform = atmelavr
board = uno
build_flags = -D XLOGGER_MAX_LEVEL=XLOG_LEVEL_DEBUG

; Release: only warnings and errors end up in the firmware.
[env:uno_release]
platform = atmelavr
board = uno
build_flags = -D XLOGGER_MAX_LEVEL=XLOG_LEVEL_WARN

[env:esp32_debug]
platform = espressif32
board = esp32dev
build_flags = -D XLOGGER_MAX_LEVEL=XLOG_LEVEL_DEBUG
